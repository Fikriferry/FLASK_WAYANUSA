<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>smart wayang</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/quiz.css') }}">

    <!-- AOS -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
</head>

<body>
    <style>
        /* Override background body jadi hitam total khusus halaman ini */
        body {
            background-color: #000 !important;
        }

        /* Section Utama */
        .smart-wayang-section {
            padding-top: 100px;
            /* Jarak dari Navbar */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1f1209 0%, #000 80%);
            padding-bottom: 40px;
        }

        /* --- CONTROL DECK UI --- */
        .control-deck {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 0;
            width: 100%;
            max-width: 1100px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 163, 115, 0.2);
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            margin: 0 20px;
        }

        /* PANEL KIRI */
        .visual-panel {
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.02);
        }

        .wayang-avatar {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 4px solid #D4A373;
            padding: 5px;
            object-fit: cover;
            box-shadow: 0 0 40px rgba(212, 163, 115, 0.15);
            margin-bottom: 30px;
            transition: transform 0.3s;
        }

        .wayang-avatar.talking {
            animation: pulse-talking 1.5s infinite ease-in-out;
            box-shadow: 0 0 60px rgba(212, 163, 115, 0.5);
            border-color: #fff;
        }

        @keyframes pulse-talking {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        .mic-status-wrapper {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 25px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mic-dot {
            width: 10px;
            height: 10px;
            background: #555;
            border-radius: 50%;
            transition: 0.3s;
        }

        .mic-dot.listening {
            background: #dc3545;
            box-shadow: 0 0 10px #dc3545;
        }

        .mic-dot.processing {
            background: #ffc107;
            box-shadow: 0 0 10px #ffc107;
        }

        /* PANEL KANAN */
        .interaction-panel {
            padding: 40px;
            display: flex;
            flex-direction: column;
            background: transparent;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        .hardware-status {
            font-size: 0.8rem;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #888;
        }

        .live-transcript {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            height: 300px;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .log-item {
            opacity: 0;
            animation: fadeIn 0.3s forwards;
            line-height: 1.5;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .log-user {
            color: #aaa;
            border-left: 2px solid #444;
            padding-left: 12px;
        }

        .log-bot {
            color: #D4A373;
            border-left: 2px solid #D4A373;
            padding-left: 12px;
            font-weight: 600;
        }

        .log-sys {
            color: #dc3545;
            font-style: italic;
            font-size: 0.8rem;
            text-align: center;
            margin: 10px 0;
        }

        .controls-group {
            display: flex;
            gap: 10px;
        }

        select.port-select {
            flex: 1;
            background: #151515;
            color: #eee;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        .icon-btn {
            width: 48px;
            background: #222;
            color: #ccc;
            border: 1px solid #333;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: #333;
            color: white;
        }

        .btn-connect {
            background: linear-gradient(135deg, #D4A373, #B88656);
            color: #000;
            font-weight: 700;
            border: none;
            padding: 0 30px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .btn-connect:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(212, 163, 115, 0.3);
        }

        .btn-connect.connected {
            background: linear-gradient(135deg, #dc3545, #a71d2a);
            color: white;
        }

        @media (max-width: 900px) {
            .control-deck {
                grid-template-columns: 1fr;
                border: none;
                background: transparent;
                box-shadow: none;
            }

            .visual-panel {
                border: none;
                padding: 20px;
            }

            .smart-wayang-section {
                padding-top: 80px;
            }
        }
    </style>

    <!-- NAVBAR -->
    {% include 'layouts/navbar.html' %}

    <!-- MAIN SECTION -->
    <section class="smart-wayang-section">
        <div class="control-deck">

            <div class="visual-panel">
                <h2
                    style="color: #D4A373; margin-bottom: 5px; font-family: 'Playfair Display', serif; font-size: 2rem;">
                    Smart Wayang</h2>
                <p
                    style="color: #888; font-size: 0.85rem; margin-bottom: 40px; letter-spacing: 3px; text-transform: uppercase;">
                    AI Physical Interface</p>

                <img src="{{ url_for('static', filename='images/cepot avatar.png') }}"
                    onerror="this.src='https://via.placeholder.com/300x300/D4A373/000000?text=Cepot+AI'"
                    id="cepotAvatar" class="wayang-avatar" alt="Cepot Avatar">

                <div class="mic-status-wrapper">
                    <div class="mic-dot" id="micDot"></div>
                    <span id="statusText" style="font-size: 0.9rem; color: #ccc;">Standby (Panggil "Halo Cepot")</span>
                </div>
            </div>

            <div class="interaction-panel">
                <div class="panel-header">
                    <div style="font-weight: 600; color: #fff; font-size: 1rem; letter-spacing: 1px;">
                        <i class="fas fa-terminal" style="margin-right: 8px; color: #D4A373;"></i> LIVE LOG
                    </div>
                    <div class="hardware-status">
                        <i class="fas fa-microchip" style="margin-right: 5px;"></i>
                        <span id="hardwareStatusText">TERPUTUS</span>
                    </div>
                </div>

                <div class="live-transcript" id="transcriptBox">
                    <div class="log-item log-bot">
                        SYSTEM: Siap! Hubungkan kabel USB Arduino untuk menggerakkan wayang.
                    </div>
                </div>

                <!-- Premium Chat Input Fallback -->
                <div class="input-group" style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <input type="text" id="chatInput" placeholder="Ketik pesan ke Cepot di sini..." 
                           style="flex: 1; background: #151515; color: #eee; border: 1px solid #333; padding: 12px; border-radius: 8px; outline: none; font-family: 'Inter', sans-serif; transition: border 0.3s;"
                           onfocus="this.style.borderColor='#D4A373'" onblur="this.style.borderColor='#333'"
                           onkeypress="if(event.key === 'Enter') sendManualMessage()">
                    <button onclick="sendManualMessage()" class="btn-connect" style="padding: 0 20px; font-size: 0.8rem; background: linear-gradient(135deg, #D4A373, #A3704C);">
                        KIRIM
                    </button>
                </div>

                <div class="controls-group">
                    <select id="portSelect" class="port-select">
                        <option value="">-- Mencari Port USB... --</option>
                    </select>

                    <button onclick="refreshPorts()" class="icon-btn" title="Refresh Port">
                        <i class="fas fa-sync-alt"></i>
                    </button>

                    <button id="btnConnect" onclick="toggleConnect()" class="btn-connect">
                        CONNECT
                    </button>
                </div>

                <p style="font-size: 0.75rem; color: #555; margin-top: 15px; text-align: center; font-style: italic;">
                    *Pastikan Serial Monitor Arduino IDE ditutup.
                </p>
            </div>
        </div>
    </section>

    <!-- AOS Script -->
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        // --- VARIABLES ---
        let isConnected = false;
        let recognition = null;
        let isListening = false;
        let wakeWordActive = false;
        let isProcessing = false;
        let wakeWordTimeout = null; // Timeout untuk memberikan batas waktu user berbicara setelah wake word
        const WAKE_WORDS = [
            "halo cepot", "hallo cepot", "he cepot", "eh cepot", "si cepot", 
            "halo copot", "halo sepot", "halo spot", "wayang", "cepot", "copot", "sepot", "pot"
        ];

        // DOM Elements
        const statusText = document.getElementById('statusText');
        const micDot = document.getElementById('micDot');
        const transcriptBox = document.getElementById('transcriptBox');
        const avatar = document.getElementById('cepotAvatar');
        const hardwareText = document.getElementById('hardwareStatusText');
        const btnConnect = document.getElementById('btnConnect');
        const portSelect = document.getElementById('portSelect');

        // 1. SETUP WEB SPEECH API
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'id-ID';
            recognition.continuous = false; // Single utterance mode is more responsive and reliable
            recognition.interimResults = false;

            let lastSpeechError = null;

            recognition.onstart = () => { 
                isListening = true; 
                micDot.classList.add('listening'); 
                // lastSpeechError TIDAK direset di sini agar error persisten di browser (seperti network block)
                // tidak membanjiri log berulang kali saat auto-restart dijalankan.
                if (wakeWordActive) {
                    statusText.innerText = "Mendengarkan... 🎤";
                    statusText.style.color = "#D4A373";
                } else {
                    resetMicUIStateOnly();
                }
            };
            
            recognition.onend = () => { 
                isListening = false; 
                micDot.classList.remove('listening'); 
                // Always restart listening if we're not actively processing/thinking/talking
                if (!isProcessing) { 
                    setTimeout(() => { try { recognition.start(); } catch (e) { } }, 1000); 
                }
            };

            recognition.onerror = (event) => {
                console.error("Speech Recognition Error:", event.error);
                
                if (event.error === 'no-speech') {
                    console.log("No speech detected.");
                    return; // Jangan update lastSpeechError untuk no-speech agar tidak mereset error sebelumnya
                }

                // Jangan membanjiri log dengan error yang sama berulang-ulang
                if (event.error === lastSpeechError) {
                    return;
                }
                lastSpeechError = event.error;

                if (event.error === 'not-allowed') {
                    addLog("⚠️ ERROR: Izin mikrofon ditolak! Izinkan akses mikrofon di browser Anda (klik ikon gembok di sebelah URL / address bar).", "log-sys");
                } else if (event.error === 'network') {
                    addLog("⚠️ ERROR: Layanan Web Speech browser mendeteksi masalah koneksi/offline. Pastikan internet lancar, coba gunakan Microsoft Edge (sangat disarankan jika Chrome bermasalah), atau ketik langsung pesan Anda.", "log-sys");
                } else {
                    addLog(`⚠️ ERROR Suara: ${event.error}`, "log-sys");
                }
            };
            
            recognition.onresult = (event) => {
                if (!event.results || event.results.length === 0) return;
                const result = event.results[event.results.length - 1];
                if (!result || result.length === 0) return;
                const text = result[0].transcript;
                if (text) {
                    // Reset error ketika suara berhasil ditangkap
                    lastSpeechError = null;
                    // Tampilkan apa yang didengar (berguna untuk debugging jika sistem terasa tidak menangkap suara)
                    addLog(`[Mendengar: "${text.trim()}"]`, "log-sys");
                    processVoiceInput(text);
                }
            };
            
            setTimeout(() => { try { recognition.start(); } catch (e) { } }, 1000);
        } else {
            addLog("Browser tidak support suara.", "log-sys");
        }

        // 2. PROSES SUARA
        function processVoiceInput(rawText) {
            // Clean punctuation and convert to lowercase for highly robust matching
            const text = rawText.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?]/g, "").replace(/\s+/g, " ").trim();
            console.log("Voice input (cleaned):", text);
            
            if (!wakeWordActive) {
                // Find matching wake word (checks longest wake words first to avoid substring mismatch)
                let matchedWord = null;
                for (const word of WAKE_WORDS) {
                    if (text.includes(word)) {
                        matchedWord = word;
                        break;
                    }
                }

                if (matchedWord) {
                    playBeep();
                    addLog("[Wake Word Terdeteksi]", "log-user");
                    
                    // Extract query that comes after the wake word (single-breath query)
                    const index = text.indexOf(matchedWord);
                    const queryPart = text.slice(index + matchedWord.length).trim();
                    
                    if (queryPart.length > 0) {
                        // User spoke the query in the same breath!
                        // e.g. "halo cepot siapa penemu wayang"
                        clearTimeout(wakeWordTimeout);
                        addLog(`User: "${queryPart}"`, "log-user");
                        statusText.innerText = "Sedang Berpikir...";
                        micDot.classList.remove('listening');
                        micDot.classList.add('processing');
                        isProcessing = true;
                        try { recognition.stop(); } catch (e) {}
                        sendToBackend(queryPart);
                    } else {
                        // Just the wake word, start waiting for the actual query
                        wakeWordActive = true;
                        statusText.innerText = "Mendengarkan... 🎤";
                        statusText.style.color = "#D4A373";
                        micDot.classList.add('listening');

                        // Set 10 seconds timeout to wait for user's question
                        clearTimeout(wakeWordTimeout);
                        wakeWordTimeout = setTimeout(() => {
                            if (wakeWordActive) {
                                addLog("[Waktu habis: Tidak ada pertanyaan selama 10 detik]", "log-sys");
                                resetMicUI();
                            }
                        }, 10000);
                    }
                }
            } else {
                // Clear active timeout since user spoke
                clearTimeout(wakeWordTimeout);
                
                if (text.includes("batal") || text.includes("stop")) {
                    wakeWordActive = false; 
                    resetMicUI(); 
                    return;
                }
                addLog(`User: "${text}"`, "log-user");
                statusText.innerText = "Sedang Berpikir...";
                micDot.classList.remove('listening');
                micDot.classList.add('processing');
                isProcessing = true;
                wakeWordActive = false;
                try { recognition.stop(); } catch (e) {}
                sendToBackend(text);
            }
        }

        function resetMicUI() {
            clearTimeout(wakeWordTimeout); // Bersihkan timeout yang berjalan
            isProcessing = false;
            wakeWordActive = false;
            statusText.innerText = 'Standby (Panggil "Halo Cepot")';
            statusText.style.color = "#ccc";
            micDot.classList.remove('processing');
            micDot.classList.remove('listening');
            try { recognition.start(); } catch (e) {}
        }

        function resetMicUIStateOnly() {
            statusText.innerText = 'Standby (Panggil "Halo Cepot")';
            statusText.style.color = "#ccc";
            micDot.classList.remove('processing');
        }

        // Audio element global
        let cepotAudio = null;

        // 3. KOMUNIKASI API
        async function sendToBackend(message) {
            statusText.innerText = "Sedang Berpikir...";
            statusText.style.color = "#ffc107";
            micDot.classList.remove('listening');
            micDot.classList.add('processing');
            
            try {
                const response = await fetch('/api/cepot/talk', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await response.json();
                
                if (data.response) {
                    // 1. Tampilkan tulisan jawaban SEGERA/INSTANT
                    addLog(`Cepot: "${data.response}"`, "log-bot");
                    
                    // 2. Play audio di frontend jika ada audio_url
                    if (data.audio_url) {
                        avatar.classList.add('talking');
                        statusText.innerText = "Cepot sedang berbicara... 🗣️";
                        statusText.style.color = "#D4A373";
                        
                        // Buat/reset audio element
                        if (cepotAudio) {
                            try { cepotAudio.pause(); } catch(e){}
                        }
                        
                        // Tambahkan cache breaker timestamp agar browser selalu mengambil audio terbaru
                        cepotAudio = new Audio(data.audio_url + "?t=" + new Date().getTime());
                        
                        // Ketika audio mulai diputar, perintahkan Arduino untuk bergerak
                        cepotAudio.onplay = async () => {
                            try {
                                await fetch('/api/cepot/arduino/start', { method: 'POST' });
                            } catch(e) {}
                        };
                        
                        // Ketika audio selesai, berhentikan Arduino dan reset UI
                        cepotAudio.onended = async () => {
                            try {
                                await fetch('/api/cepot/arduino/stop', { method: 'POST' });
                            } catch(e) {}
                            avatar.classList.remove('talking');
                            resetMicUI();
                        };
                        
                        // Jika terjadi error pada audio, berhentikan Arduino dan reset UI
                        cepotAudio.onerror = async () => {
                            try {
                                await fetch('/api/cepot/arduino/stop', { method: 'POST' });
                            } catch(e) {}
                            avatar.classList.remove('talking');
                            resetMicUI();
                        };
                        
                        // Mulai pemutaran
                        cepotAudio.play().catch(async (e) => {
                            console.error("Audio playback error:", e);
                            // Fallback jika browser memblokir autoplay
                            try {
                                await fetch('/api/cepot/arduino/stop', { method: 'POST' });
                            } catch(err) {}
                            avatar.classList.remove('talking');
                            resetMicUI();
                        });
                    } else {
                        resetMicUI();
                    }
                } else {
                    resetMicUI();
                }
            } catch (error) { 
                addLog("Error server.", "log-sys"); 
                resetMicUI();
            }
        }

        window.sendManualMessage = function () {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;
            
            // Log user message
            addLog(`User (Ketik): "${message}"`, "log-user");
            
            // Set UI to thinking
            statusText.innerText = "Sedang Berpikir...";
            micDot.classList.remove('listening');
            micDot.classList.add('processing');
            isProcessing = true;
            
            // Stop voice recognition temporarily
            try { recognition.stop(); } catch (e) {}
            
            // Clear input
            input.value = "";
            
            // Send to backend
            sendToBackend(message);
        };

        // 4. KONEKSI HARDWARE
        window.refreshPorts = async function () {
            try {
                portSelect.innerHTML = '<option>...</option>';
                const res = await fetch('/api/cepot/ports');
                const data = await res.json();
                portSelect.innerHTML = '<option value="">-- Pilih Port --</option>';
                if (data.ports) data.ports.forEach(p => portSelect.innerHTML += `<option value="${p}">${p}</option>`);
            } catch (e) { }
        };

        window.toggleConnect = async function () {
            const port = portSelect.value;
            if (!isConnected) {
                if (!port) return alert("Pilih Port!");
                btnConnect.innerText = "...";
                try {
                    const res = await fetch('/api/cepot/connect', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ port: port })
                    });
                    const data = await res.json();
                    if (data.success) {
                        isConnected = true;
                        setHardwareConnected(true);
                        addLog(`Terhubung: ${port}`, "log-sys");
                    } else { alert(data.message); btnConnect.innerText = "CONNECT"; }
                } catch (e) { btnConnect.innerText = "CONNECT"; }
            } else {
                try {
                    await fetch('/api/cepot/disconnect', { method: 'POST' });
                    isConnected = false;
                    setHardwareConnected(false);
                    addLog("Terputus.", "log-sys");
                } catch (e) { }
            }
        };

        function setHardwareConnected(status) {
            if (status) {
                btnConnect.innerText = "DISCONNECT";
                btnConnect.classList.add('connected');
                hardwareText.innerText = "TERHUBUNG";
                hardwareText.style.color = "#28a745";
            } else {
                btnConnect.innerText = "CONNECT";
                btnConnect.classList.remove('connected');
                hardwareText.innerText = "TERPUTUS";
                hardwareText.style.color = "#666";
            }
        }

        function addLog(text, className) {
            const div = document.createElement('div');
            div.className = `log-item ${className}`;
            div.innerText = text;
            transcriptBox.appendChild(div);
            transcriptBox.scrollTop = transcriptBox.scrollHeight;
        }

        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 600; gain.gain.value = 0.1;
                osc.start(); setTimeout(() => osc.stop(), 150);
            } catch (e) { }
        }

        refreshPorts();
    </script>
</body>

</html>
